<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY 고소작업차 예약 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-title">
      <div class="mark"></div>
      <h1>SKY 고소작업차 예약</h1>
      <span id="clock"></span>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="request">예약 신청</button>
      <button class="tab" data-tab="board">전체 현황판</button>
      <button class="tab" data-tab="driver">기사님 오늘 일정</button>
      <button class="tab" data-tab="calendar">월간 캘린더</button>
    </div>
  </div>

  <main>
    <!-- ============ TAB 1: 신청 ============ -->
    <section id="tab-request">
      <h2 class="section-title">사용 예약 신청</h2>
      <p class="section-sub">신청과 동시에 아래 현황판에 즉시 반영됩니다. 같은 시간대가 이미 예약되어 있으면 신청이 자동으로 거부됩니다.</p>
      <div class="layout-2col">
        <div class="card">
          <div id="formMsg"></div>
          <div class="field-row">
            <div class="field"><label>신청자 이름</label><input id="f-name" type="text" placeholder="홍길동"></div>
            <div class="field"><label>부서</label><input id="f-dept" type="text" placeholder="생산1팀"></div>
          </div>
          <div class="field"><label>연락처</label><input id="f-phone" type="tel" placeholder="010-0000-0000"></div>
          <div class="field"><label>사용 날짜</label><input id="f-date" type="date"></div>
          <div class="field-row">
            <div class="field"><label>시작 시간</label><input id="f-start" type="time" value="09:00"></div>
            <div class="field"><label>종료 시간</label><input id="f-end" type="time" value="10:00"></div>
          </div>
          <div class="field"><label>작업 위치</label><input id="f-loc" type="text" placeholder="예: 2공장 B동 외벽"></div>
          <div class="field"><label>작업 내용</label><textarea id="f-work" placeholder="예: 조명 교체 및 배관 점검"></textarea></div>
          <button class="btn-primary" id="submitBtn">예약 신청하기</button>
        </div>
        <div>
          <div class="preview-date-label" id="previewLabel">날짜를 선택하면 해당일 예약 현황이 표시됩니다</div>
          <div id="previewList"></div>
        </div>
      </div>
    </section>

    <!-- ============ TAB 2: 현황판 ============ -->
    <section id="tab-board" class="hidden">
      <h2 class="section-title">전체 예약 현황판</h2>
      <p class="section-sub">오늘부터 14일간의 예약 현황입니다. 잘못 등록된 건은 취소할 수 있습니다.</p>
      <div id="boardList"></div>
    </section>

    <!-- ============ TAB 3: 기사님 ============ -->
    <section id="tab-driver" class="hidden">
      <div class="driver-toggle">
        <button id="btnToday" class="active">오늘</button>
        <button id="btnTomorrow">내일</button>
      </div>
      <div class="driver-date" id="driverDate"></div>
      <div class="driver-count" id="driverCount"></div>
      <div id="driverList"></div>
      <p class="footnote">매일 아침 이 화면만 확인하시면 됩니다. 별도 전화 안내 없이 신청 즉시 이 목록에 자동으로 반영됩니다.</p>
    </section>

    <!-- ============ TAB 4: 월간 캘린더 ============ -->
    <section id="tab-calendar" class="hidden">
      <h2 class="section-title">월간 캘린더</h2>
      <p class="section-sub">예약이 있는 날짜에는 건수가 표시됩니다. 날짜를 누르면 아래에 그날 일정이 크게 표시됩니다.</p>
      <div class="cal-nav">
        <button id="calPrev">‹</button>
        <div class="cal-label" id="calMonthLabel"></div>
        <button id="calNext">›</button>
      </div>
      <div id="calGrid"></div>
      <div id="calDayDetail" class="cal-day-detail"></div>
    </section>
  </main>
</div>

<!-- Firebase (compat SDK, 별도 빌드 도구 없이 script 태그로 바로 사용) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
